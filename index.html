<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Flight Simulator - Hyperdrive Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            z-index: 100;
            font-size: 14px;
            pointer-events: none;
        }

        #hyperdrive-status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 200;
        }

        #hyperdrive-status.active {
            opacity: 1;
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            font-size: 16px;
            opacity: 0.7;
            z-index: 100;
            pointer-events: none;
        }

        #warp-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.8) 0%, rgba(0, 100, 255, 0) 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.1s;
        }

        #warp-flash.active {
            opacity: 1;
        }

        #tunnel-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 20%, rgba(0, 50, 100, 0.3) 60%, rgba(0, 20, 50, 0.8) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 49;
            transition: opacity 0.5s;
        }

        #tunnel-effect.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="warp-flash"></div>
    <div id="tunnel-effect"></div>

    <div id="ui-overlay">
        <div>SPEED: <span id="velocity">0</span></div>
        <div>STARS: <span id="star-count">0</span></div>
        <div>MODE: <span id="mode">CRUISE</span></div>
    </div>

    <div id="hyperdrive-status">HYPERDRIVE ENGAGED</div>

    <div id="instructions">
        <strong>H</strong>: Hyperdrive | <strong>↑/↓</strong>: Speed ±0.01 | <strong>←/→</strong>: Stars ±1000
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.z = 0;

        // Star field parameters
        let starCount = 15000;
        const SPACE_SIZE = 2000;
        const CRUISE_SPEED = 2;
        const HYPERDRIVE_SPEED = 150;
        const SPEED_INCREMENT = 0.01;
        const STAR_COUNT_INCREMENT = 1000;

        // State management
        let hyperdriveActive = false;
        let currentSpeed = CRUISE_SPEED;
        let targetSpeed = CRUISE_SPEED;
        let preHyperdriveSpeed = CRUISE_SPEED; // Remember speed before hyperdrive
        let starField = null;
        let starStreaks = [];
        let baseFOV = 75;
        let targetFOV = 75;
        let cameraShake = 0;
        let hyperdriveTransition = 0;

        // Create circular star texture
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            // Create radial gradient for star glow
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.6)');
            gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // Create star field
        function createStarField() {
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = [];
            const starColors = [];
            const starSizes = [];

            for (let i = 0; i < starCount; i++) {
                // Random position in a cylinder around the flight path
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * SPACE_SIZE;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                const z = (Math.random() - 0.5) * SPACE_SIZE * 4;

                starPositions.push(x, y, z);

                // Star color variation (white, blue, orange, red)
                const colorType = Math.random();
                let color;
                if (colorType < 0.6) {
                    color = new THREE.Color(1, 1, 1); // White
                } else if (colorType < 0.8) {
                    color = new THREE.Color(0.7, 0.8, 1); // Blue
                } else if (colorType < 0.95) {
                    color = new THREE.Color(1, 0.8, 0.6); // Orange
                } else {
                    color = new THREE.Color(1, 0.6, 0.6); // Red
                }

                starColors.push(color.r, color.g, color.b);

                // Varied star sizes for depth
                const size = Math.random() * 3 + 1;
                starSizes.push(size);
            }

            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
            starGeometry.setAttribute('size', new THREE.Float32BufferAttribute(starSizes, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 2,
                sizeAttenuation: true,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                map: createStarTexture()
            });

            const starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);

            return starField;
        }

        // Create hyperdrive streak effect
        function createStarStreaks() {
            const streaks = [];
            const streakCount = 1500; // Increased from 800

            for (let i = 0; i < streakCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * SPACE_SIZE * 0.8;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                const z = (Math.random() - 0.5) * SPACE_SIZE * 2;

                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array([
                    x, y, z,
                    x, y, z - 100
                ]);

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                // More varied and intense colors
                const colorType = Math.random();
                let color;
                if (colorType < 0.5) {
                    color = new THREE.Color(0.9, 0.95, 1); // Bright white-blue
                } else if (colorType < 0.8) {
                    color = new THREE.Color(0.5, 0.8, 1); // Cyan
                } else if (colorType < 0.95) {
                    color = new THREE.Color(0.8, 0.9, 1); // Light blue
                } else {
                    color = new THREE.Color(1, 1, 1); // Pure white
                }

                const material = new THREE.LineBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending,
                    linewidth: 3 // Increased from 2
                });

                const streak = new THREE.Line(geometry, material);
                scene.add(streak);
                streaks.push({
                    mesh: streak,
                    baseZ: z,
                    speed: Math.random() * 0.5 + 0.5,
                    baseColor: color
                });
            }

            return streaks;
        }

        // Regenerate star field with new count
        function regenerateStarField() {
            if (starField) {
                scene.remove(starField);
                starField.geometry.dispose();
                starField.material.dispose();
            }
            starField = createStarField();
            document.getElementById('star-count').textContent = starCount;
        }

        // Ambient starlight
        const ambientLight = new THREE.AmbientLight(0x222244, 0.3);
        scene.add(ambientLight);

        // Distant star glow
        const pointLight = new THREE.PointLight(0x4488ff, 0.5, 5000);
        pointLight.position.set(0, 0, -2000);
        scene.add(pointLight);

        // Initialize scene
        regenerateStarField();
        starStreaks = createStarStreaks();

        // Keyboard controls
        let hyperdriveKeyPressed = false;

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h' && !hyperdriveKeyPressed) {
                hyperdriveKeyPressed = true;
                hyperdriveActive = !hyperdriveActive;

                if (hyperdriveActive) {
                    // Save current speed before engaging hyperdrive
                    preHyperdriveSpeed = targetSpeed;

                    targetSpeed = HYPERDRIVE_SPEED;
                    targetFOV = 95; // Widen FOV for speed effect
                    hyperdriveTransition = 1.0;
                    cameraShake = 1.0;

                    document.getElementById('mode').textContent = 'HYPERDRIVE';
                    document.getElementById('hyperdrive-status').classList.add('active');
                    document.getElementById('warp-flash').classList.add('active');
                    document.getElementById('tunnel-effect').classList.add('active');

                    // Flash effect
                    setTimeout(() => {
                        document.getElementById('hyperdrive-status').classList.remove('active');
                    }, 1500);

                    // Remove initial flash after brief moment
                    setTimeout(() => {
                        document.getElementById('warp-flash').classList.remove('active');
                    }, 200);
                } else {
                    // Return to pre-hyperdrive speed
                    targetSpeed = preHyperdriveSpeed;
                    targetFOV = 75; // Return to normal FOV
                    hyperdriveTransition = 0;

                    // Restore mode based on previous speed
                    if (preHyperdriveSpeed === CRUISE_SPEED) {
                        document.getElementById('mode').textContent = 'CRUISE';
                    } else {
                        document.getElementById('mode').textContent = 'MANUAL';
                    }
                    document.getElementById('tunnel-effect').classList.remove('active');
                }
            }

            // Speed controls with arrow keys
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!hyperdriveActive) {
                    targetSpeed += SPEED_INCREMENT;
                    preHyperdriveSpeed = targetSpeed; // Update saved speed
                    document.getElementById('mode').textContent = 'MANUAL';
                }
            }

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!hyperdriveActive) {
                    targetSpeed = Math.max(0, targetSpeed - SPEED_INCREMENT);
                    preHyperdriveSpeed = targetSpeed; // Update saved speed
                    document.getElementById('mode').textContent = 'MANUAL';
                }
            }

            // Star count controls with left/right arrow keys
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                starCount = Math.max(100, starCount - STAR_COUNT_INCREMENT);
                regenerateStarField();
            }

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                starCount = Math.min(50000, starCount + STAR_COUNT_INCREMENT);
                regenerateStarField();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'h') {
                hyperdriveKeyPressed = false;
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Smooth speed transition - faster when dropping out of hyperdrive
            const speedTransitionRate = (!hyperdriveActive && currentSpeed > targetSpeed + 10) ? 0.15 : 0.02;
            currentSpeed += (targetSpeed - currentSpeed) * speedTransitionRate;

            // Smooth FOV transition for cinematic zoom effect - faster when dropping out of hyperdrive
            const fovTransitionRate = (!hyperdriveActive && camera.fov > targetFOV + 2) ? 0.2 : 0.05;
            camera.fov += (targetFOV - camera.fov) * fovTransitionRate;
            camera.updateProjectionMatrix();

            // Camera shake during hyperdrive transition
            if (cameraShake > 0) {
                cameraShake *= 0.92; // Decay shake
                const shakeIntensity = cameraShake * 0.5;
                camera.rotation.z = (Math.random() - 0.5) * shakeIntensity * 0.02;
            }

            // Update star positions
            const positions = starField.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 2] += currentSpeed;

                // Wrap stars around
                if (positions[i + 2] > SPACE_SIZE * 2) {
                    positions[i + 2] = -SPACE_SIZE * 2;

                    // Randomize position when wrapping
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * SPACE_SIZE;
                    positions[i] = Math.cos(angle) * radius;
                    positions[i + 1] = Math.sin(angle) * radius;
                }
            }
            starField.geometry.attributes.position.needsUpdate = true;

            // Update hyperdrive streaks
            if (hyperdriveActive) {
                starStreaks.forEach((streak, index) => {
                    const positions = streak.mesh.geometry.attributes.position.array;
                    const speed = currentSpeed * streak.speed;

                    // Move streak forward
                    positions[2] += speed;
                    positions[5] += speed;

                    // Extend streak length based on speed - much longer streaks!
                    const streakLength = Math.min(currentSpeed * 5, 800);
                    positions[5] = positions[2] - streakLength;

                    // Wrap around
                    if (positions[2] > SPACE_SIZE * 2) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = Math.random() * SPACE_SIZE * 0.8;
                        positions[0] = Math.cos(angle) * radius;
                        positions[1] = Math.sin(angle) * radius;
                        positions[2] = -SPACE_SIZE * 2;
                        positions[3] = positions[0];
                        positions[4] = positions[1];
                        positions[5] = positions[2] - streakLength;
                    }

                    streak.mesh.geometry.attributes.position.needsUpdate = true;

                    // Intense fade in with pulsing effect
                    const pulseEffect = Math.sin(Date.now() * 0.005 + index * 0.1) * 0.15 + 0.85;
                    const targetOpacity = hyperdriveActive ? 0.85 * pulseEffect : 0;
                    streak.mesh.material.opacity += (targetOpacity - streak.mesh.material.opacity) * 0.08;
                });
            } else {
                // Fade out streaks
                starStreaks.forEach(streak => {
                    streak.mesh.material.opacity *= 0.92;
                });
            }

            // Camera movement - more dramatic during hyperdrive
            const movementScale = hyperdriveActive ? 4 : 2;
            camera.position.x = Math.sin(Date.now() * 0.0001) * movementScale;
            camera.position.y = Math.cos(Date.now() * 0.00015) * (movementScale * 0.75);

            // Update UI
            const velocity = currentSpeed.toFixed(2);
            document.getElementById('velocity').textContent = velocity;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
